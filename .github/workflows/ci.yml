  # ============================================================================
  # Epic 5: Phase 1 Critical Security Tools
  # These jobs block PR merges on HIGH/CRITICAL findings
  # Jobs run in parallel for optimal performance
  # ============================================================================

  # ----------------------------------------------------------------------------
  # git-secrets: Detect leaked secrets, credentials, and private keys
  # Blocks: ANY secrets detected (no severity threshold)
  # ----------------------------------------------------------------------------
  git-secrets:
    name: "Security: Detect Leaked Secrets"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/diamondslab/diamonds-dev-env:feature-epic2-container-setup
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    timeout-minutes: 5
    continue-on-error: false  # Block PR on ANY secrets found

    steps:
      - name: Checkout code with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history required for git-secrets scan
          submodules: recursive

      - name: Run git-secrets scan
        id: scan
        run: |
          echo "🔍 Scanning repository for leaked secrets..."
          
          # Run git-secrets on full repository and working directory
          git secrets --scan || {
            echo "❌ git-secrets detected potential secrets in the repository"
            echo "Review the output above to identify and remove sensitive data"
            exit 1
          }
          
          echo "✅ No secrets detected"

      - name: Upload git-secrets report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: git-secrets-report
          path: |
            .git/
          retention-days: 30

  # ----------------------------------------------------------------------------
  # Slither: Smart contract static analysis for security vulnerabilities
  # Blocks: HIGH and CRITICAL severity findings only
  # ----------------------------------------------------------------------------
  slither:
    name: "Security: Smart Contract Analysis (Slither)"
    runs-on: ubuntu-latest
    needs: compile  # Requires compiled contracts
    container:
      image: ghcr.io/diamondslab/diamonds-dev-env:feature-epic2-container-setup
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    timeout-minutes: 10
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download compilation artifacts
        uses: actions/download-artifact@v4
        with:
          name: compilation-artifacts

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/yarn
            node_modules
            **/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Slither analysis
        id: slither
        continue-on-error: true  # Allow script to parse results
        run: |
          echo "🔍 Running Slither smart contract analysis..."
          
          # Run Slither with configuration from slither.config.json
          # Generate both JSON (for parsing) and SARIF (for GitHub Code Scanning)
          slither . \
            --config-file slither.config.json \
            --json slither-results.json \
            --sarif slither-results.sarif \
            --no-fail-pedantic || true
          
          echo "✅ Slither analysis complete"

      - name: Check Slither results for HIGH/CRITICAL issues
        run: |
          if [ ! -f slither-results.json ]; then
            echo "⚠️ Slither results file not found"
            exit 0
          fi
          
          # Parse Slither JSON output for HIGH and CRITICAL severity findings
          high_count=$(jq '[.results.detectors[] | select(.impact == "High")] | length' slither-results.json 2>/dev/null || echo "0")
          critical_count=$(jq '[.results.detectors[] | select(.impact == "Critical")] | length' slither-results.json 2>/dev/null || echo "0")
          medium_count=$(jq '[.results.detectors[] | select(.impact == "Medium")] | length' slither-results.json 2>/dev/null || echo "0")
          low_count=$(jq '[.results.detectors[] | select(.impact == "Low")] | length' slither-results.json 2>/dev/null || echo "0")
          
          echo "📊 Slither Findings Summary:"
          echo "  Critical: $critical_count"
          echo "  High:     $high_count"
          echo "  Medium:   $medium_count"
          echo "  Low:      $low_count"
          
          # Block PR only on HIGH or CRITICAL findings
          total_blocking=$((critical_count + high_count))
          
          if [ "$total_blocking" -gt 0 ]; then
            echo ""
            echo "❌ Found $total_blocking HIGH/CRITICAL severity issues"
            echo "Review slither-results.json artifact for details"
            exit 1
          fi
          
          echo ""
          echo "✅ No HIGH/CRITICAL severity issues found"

      - name: Upload Slither reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slither-report
          path: |
            slither-results.json
            slither-results.sarif
          retention-days: 30

  # ----------------------------------------------------------------------------
  # npm audit: Dependency vulnerability scanning
  # Blocks: HIGH and CRITICAL severity vulnerabilities only
  # ----------------------------------------------------------------------------
  npm-audit:
    name: "Security: Dependency Audit (npm)"
    runs-on: ubuntu-latest
    needs: compile  # Ensures dependencies are installed
    container:
      image: ghcr.io/diamondslab/diamonds-dev-env:feature-epic2-container-setup
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    timeout-minutes: 5
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/yarn
            node_modules
            **/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run npm audit
        id: audit
        continue-on-error: true  # Allow script to parse results
        run: |
          echo "🔍 Running npm audit on all dependencies..."
          
          # Run npm audit via yarn (Yarn 4 uses npm audit under the hood)
          # Severity levels: info, low, moderate, high, critical
          # Block on: high, critical
          yarn npm audit --all --recursive --json > npm-audit-results.json || true
          
          echo "✅ npm audit complete"

      - name: Check audit results for HIGH/CRITICAL vulnerabilities
        run: |
          if [ ! -f npm-audit-results.json ]; then
            echo "⚠️ npm audit results file not found"
            exit 0
          fi
          
          # Parse npm audit JSON output
          # Note: Yarn 4's npm audit output format differs slightly from npm's
          critical_count=$(jq '[.vulnerabilities | to_entries[] | select(.value.severity == "critical")] | length' npm-audit-results.json 2>/dev/null || echo "0")
          high_count=$(jq '[.vulnerabilities | to_entries[] | select(.value.severity == "high")] | length' npm-audit-results.json 2>/dev/null || echo "0")
          moderate_count=$(jq '[.vulnerabilities | to_entries[] | select(.value.severity == "moderate")] | length' npm-audit-results.json 2>/dev/null || echo "0")
          low_count=$(jq '[.vulnerabilities | to_entries[] | select(.value.severity == "low")] | length' npm-audit-results.json 2>/dev/null || echo "0")
          
          echo "📊 npm Audit Findings Summary:"
          echo "  Critical: $critical_count"
          echo "  High:     $high_count"
          echo "  Moderate: $moderate_count"
          echo "  Low:      $low_count"
          
          # Block PR only on HIGH or CRITICAL vulnerabilities
          total_blocking=$((critical_count + high_count))
          
          if [ "$total_blocking" -gt 0 ]; then
            echo ""
            echo "❌ Found $total_blocking HIGH/CRITICAL severity vulnerabilities"
            echo "Review npm-audit-results.json artifact for details"
            exit 1
          fi
          
          echo ""
          echo "✅ No HIGH/CRITICAL severity vulnerabilities found"

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit-results.json
          retention-days: 30

  # ============================================================================
  # Epic 5: Phase 2 Extended Security Tools
  # These jobs report warnings only (non-blocking) during initial rollout
  # Jobs run in parallel for optimal performance
  # ============================================================================

  # ----------------------------------------------------------------------------
  # Snyk: Comprehensive vulnerability database scanning
  # Blocks: No (warning-only for Phase 2)
  # ----------------------------------------------------------------------------
  snyk:
    name: "Security: Snyk Vulnerability Scan"
    runs-on: ubuntu-latest
    needs: compile  # Requires compiled contracts and installed dependencies
    container:
      image: ghcr.io/diamondslab/diamonds-dev-env:feature-epic2-container-setup
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    timeout-minutes: 10
    continue-on-error: true  # Warning-only (non-blocking)
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/yarn
            node_modules
            **/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Snyk CLI
        run: |
          echo "📦 Installing Snyk CLI..."
          npm install -g snyk
          snyk --version

      - name: Authenticate with Snyk
        run: |
          if [ -z "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "⚠️ SNYK_TOKEN not configured"
            echo "Snyk scanning will be skipped"
            echo "See .github/SNYK_TOKEN_SETUP.md for configuration instructions"
            exit 0
          fi
          
          echo "🔑 Authenticating with Snyk..."
          snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk vulnerability scan
        id: snyk
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "⚠️ Skipping Snyk scan - token not configured"
            exit 0
          fi
          
          echo "🔍 Running Snyk vulnerability scan on entire monorepo..."
          
          # Run Snyk test with JSON and SARIF outputs
          snyk test --all-projects --json --json-file-output=snyk-results.json --sarif-file-output=snyk-results.sarif || {
            echo "⚠️ Snyk found vulnerabilities or encountered an error"
            echo "Check snyk-results.json for details"
          }
          
          echo "✅ Snyk scan complete"

      - name: Generate Snyk summary
        if: always()
        run: |
          if [ ! -f snyk-results.json ]; then
            echo "⚠️ Snyk results not available"
            exit 0
          fi
          
          # Parse Snyk JSON output for vulnerability counts
          critical_count=$(jq '[.vulnerabilities[]? | select(.severity == "critical")] | length' snyk-results.json 2>/dev/null || echo "0")
          high_count=$(jq '[.vulnerabilities[]? | select(.severity == "high")] | length' snyk-results.json 2>/dev/null || echo "0")
          medium_count=$(jq '[.vulnerabilities[]? | select(.severity == "medium")] | length' snyk-results.json 2>/dev/null || echo "0")
          low_count=$(jq '[.vulnerabilities[]? | select(.severity == "low")] | length' snyk-results.json 2>/dev/null || echo "0")
          
          echo "📊 Snyk Findings Summary:"
          echo "  Critical: $critical_count"
          echo "  High:     $high_count"
          echo "  Medium:   $medium_count"
          echo "  Low:      $low_count"
          echo ""
          echo "ℹ️  Phase 2: Snyk findings are informational (non-blocking)"

      - name: Upload Snyk reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-report
          path: |
            snyk-results.json
            snyk-results.sarif
          retention-days: 30

  # ----------------------------------------------------------------------------
  # Semgrep: Static analysis for code security issues
  # Blocks: No (warning-only for Phase 2)
  # ----------------------------------------------------------------------------
  semgrep:
    name: "Security: Static Analysis (Semgrep)"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/diamondslab/diamonds-dev-env:feature-epic2-container-setup
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    timeout-minutes: 10
    continue-on-error: true  # Warning-only (non-blocking)
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Semgrep security scan
        id: semgrep
        run: |
          echo "🔍 Running Semgrep static analysis..."
          
          # Run Semgrep with community security rules
          # Target: TypeScript, JavaScript, and Solidity files
          # Output: SARIF format for GitHub Code Scanning integration
          semgrep scan \
            --config=auto \
            --sarif \
            --output=semgrep-results.sarif \
            --json \
            --json-output=semgrep-results.json \
            --verbose \
            . || {
            echo "⚠️ Semgrep found security issues or encountered an error"
            echo "Check semgrep-results.json for details"
          }
          
          echo "✅ Semgrep scan complete"

      - name: Generate Semgrep summary
        if: always()
        run: |
          if [ ! -f semgrep-results.json ]; then
            echo "⚠️ Semgrep results not available"
            exit 0
          fi
          
          # Parse Semgrep JSON output for finding counts by severity
          error_count=$(jq '[.results[]? | select(.extra.severity == "ERROR")] | length' semgrep-results.json 2>/dev/null || echo "0")
          warning_count=$(jq '[.results[]? | select(.extra.severity == "WARNING")] | length' semgrep-results.json 2>/dev/null || echo "0")
          info_count=$(jq '[.results[]? | select(.extra.severity == "INFO")] | length' semgrep-results.json 2>/dev/null || echo "0")
          
          echo "📊 Semgrep Findings Summary:"
          echo "  Error:   $error_count"
          echo "  Warning: $warning_count"
          echo "  Info:    $info_count"
          echo ""
          echo "ℹ️  Phase 2: Semgrep findings are informational (non-blocking)"

      - name: Upload Semgrep reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: |
            semgrep-results.json
            semgrep-results.sarif
          retention-days: 30

  # ----------------------------------------------------------------------------
  # OSV-Scanner: Open Source Vulnerabilities detection
  # Blocks: No (warning-only for Phase 2)
  # ----------------------------------------------------------------------------
  osv-scanner:
    name: "Security: OSV Database Check"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/diamondslab/diamonds-dev-env:feature-epic2-container-setup
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    timeout-minutes: 5
    continue-on-error: true  # Warning-only (non-blocking)
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run OSV-Scanner
        id: osv
        run: |
          echo "🔍 Running OSV-Scanner on lock files..."
          
          # Run OSV-Scanner on yarn.lock
          # OSV-Scanner checks Google's Open Source Vulnerabilities database
          osv-scanner scan --lockfile=yarn.lock --format=json --output=osv-results.json || {
            echo "⚠️ OSV-Scanner found vulnerabilities or encountered an error"
            echo "Check osv-results.json for details"
          }
          
          echo "✅ OSV-Scanner complete"

      - name: Generate OSV-Scanner summary
        if: always()
        run: |
          if [ ! -f osv-results.json ]; then
            echo "⚠️ OSV-Scanner results not available"
            exit 0
          fi
          
          # Parse OSV-Scanner JSON output
          vuln_count=$(jq '[.results[]?.packages[]?.vulnerabilities[]?] | length' osv-results.json 2>/dev/null || echo "0")
          
          echo "📊 OSV-Scanner Findings Summary:"
          echo "  Vulnerabilities found: $vuln_count"
          echo ""
          echo "ℹ️  Phase 2: OSV-Scanner findings are informational (non-blocking)"

      - name: Upload OSV-Scanner report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osv-scanner-report
          path: osv-results.json
          retention-days: 30

  # ============================================================================
  # Validate Container Job - Test container setup and functionality
  # ============================================================================
  validate-container:
    name: Validate Container Setup
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/diamondslab/diamonds-dev-env:feature-epic2-container-setup
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    timeout-minutes: 10
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable Corepack for Yarn 4
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run container validation
        run: ./scripts/test-container-setup.sh
